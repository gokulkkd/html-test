<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Line Break Remover</title>
    <link rel="icon" type="image/svg+xml" href="img/fav.svg">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ===== NAVIGATION ===== -->
    <header class="site-header">
        <div class="nav-buttons">
            <a href="index.html" class="nav-button active">
                Line Break
            </a>

            <a href="notepad.html" class="nav-button">
                Notepad
            </a>
        </div>
    </header>


    <!-- ===== LINE BREAK SECTION ===== -->
    <div class="section-1">

        <div class="container">

            <div class="box-holder">

                <!-- ===== INPUT BOX ===== -->
                <div class="box-1">

                    <div class="title">
                        <h2>Remove Line Breaks</h2>
                    </div>

                    <div class="text-area1">
                        <textarea id="line-break" placeholder="Paste your text here..."></textarea>
                    </div>

                    <div class="button-group1">

                        <button id="remove-linebreak">
                            Remove Line Breaks
                        </button>

                        <button id="reset-linebreak">
                            Reset
                        </button>

                    </div>

                </div>


                <!-- ===== OUTPUT BOX ===== -->
                <div class="box-2">

                    <div class="title">
                        <h2>New Text Without Line Breaks</h2>
                    </div>

                    <div class="text-area2">

                        <textarea id="line-copy" placeholder="Your cleaned text will appear here..."></textarea>

                    </div>

                    <div class="button-group2">

                        <button id="copy-to-clip">
                            Copy to Clipboard
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- ===== JAVASCRIPT ===== -->
    <script src="js/script.js"></script>

</body>

</html>
