<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Break Remover</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>test</header>
    <div class="section-1">
        <div class="container">
            <div class="box-holder">
                <div class="box-1">
                    <div class="title">
                        <h2>Remove Line Breaks</h2>
                    </div>
                    <div class="text-area1">
                        <textarea name="" id="line-break"></textarea>
                    </div>
                    <div class="button-group1">
                        <button id="remove-linebreak">Remove Line Breaks</button>
                        <button id="reset-linebreak">Reset</button>
                    </div>
                </div>
                <div class="box-2">
                    <div class="title">
                        <h2>New Text Without Line Breaks</h2>
                    </div>
                    <div class="text-area2">
                        <textarea name="" id="line-copy"></textarea>
                    </div>
                    <div class="button-group2">
                        <button id="copy-to-clip">Copy to Clipboard</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
