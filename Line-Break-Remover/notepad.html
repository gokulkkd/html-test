<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notepad</title>
    <link rel="icon" type="image/svg+xml" href="img/fav.svg">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ===== NAVIGATION ===== -->
    <header class="site-header">
        <div class="nav-buttons">

            <a href="index.html" class="nav-button">
                Line Break
            </a>

            <a href="notepad.html" class="nav-button active">
                Notepad
            </a>

        </div>
    </header>


    <!-- ===== NOTEPAD SECTION ===== -->

    <div class="notepad-section">

        <div class="notepad-box">

            <!-- ===== TITLE ===== -->

            <div class="notepad-header">

                <div class="title">
                    <h2>Notepad</h2>
                </div>

            </div>


            <!-- ===== TEXTAREA ===== -->

            <div class="notepad-area">

                <textarea id="notepad-text" placeholder="Start typing or paste your text here..."></textarea>

            </div>


            <!-- ===== BUTTONS ===== -->

            <div class="notepad-buttons">

                <button id="copy-notepad">
                    Copy
                </button>

                <button id="reset-notepad">
                    Reset
                </button>

                <button id="save-notepad">
                    Save to Disk
                </button>

            </div>


            <!-- ===== MESSAGE ===== -->

            <p id="notepad-message"></p>

        </div>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
